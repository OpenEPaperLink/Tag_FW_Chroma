name: Firmware and G5 tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - run: python3 tests/packed_g5/run_tests.py --sanitize
      - run: python3 tests/packed_g5/test_storage.py

  firmware:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build: [chroma29, chroma29_8151, chroma42, chroma42_8176, chroma60, chroma74r, chroma74y]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install SDCC 4.2 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y sdcc make binutils
          sdcc --version
      - run: make -C Chroma_Tag_FW/OEPL BUILD=${{ matrix.build }}
      - name: Check flash and legacy OTA payload limit
        env:
          BUILD: ${{ matrix.build }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          image = next((Path('Chroma_Tag_FW/builds') / os.environ['BUILD']).glob('*_full_*.bin'))
          size = image.stat().st_size
          print(f'{image}: {size} bytes (maximum 32743)')
          assert 0 < size <= 32743, 'Firmware exceeds the legacy OTA payload limit'
          PY
